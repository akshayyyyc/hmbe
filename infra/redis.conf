# ── Redis config for HomeManager ───────────────────────────────────────
bind 0.0.0.0
protected-mode yes
port 6379

# Persist to disk every 60 seconds if ≥1 change
save 60 1

# Disable the default password — we rely on Docker network isolation.
# Uncomment and set in production:
# requirepass <strong-password>

maxmemory 256mb
maxmemory-policy allkeys-lru
